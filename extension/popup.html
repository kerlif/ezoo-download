<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* EDM palette (from the supplied logo, 2026-11-05): navy #253149 / #1D283A,
     blue #4687C7, green #54AB64, red #C2453F, grey #B0B3B8. White text on
     raw #4687C7 is only 3.78:1, so fills carrying white text use the
     AA-safe blue #3570A6 (5.22:1), hover #2F6395 (6.29:1); green text
     and fills use #2E7D3F (5.10:1). Header is navy with white text;
     cards stay white. All fills flat. */
  body { font: 14px/1.45 "Segoe UI", system-ui, sans-serif; color: #1f2733; margin: 0; width: 420px; min-height: 260px; background: #f4f6fa; }
  header { display: flex; align-items: center; gap: 8px; padding: 14px 16px; background: #253149; border-bottom: 1px solid #1D283A; }
  header img { width: 26px; height: 26px; }
  .gear { background: none; color: #B0B3B8; font-size: 18px; padding: 2px 6px; }
  .gear:hover { background: rgba(255,255,255,.12); color: #fff; }
  header b { font-size: 16px; color: #fff; }
  .dot { margin-left: auto; font-size: 12px; color: #B0B3B8; }
  .dot::before { content: "●"; margin-right: 4px; color: #B0B3B8; }
  .dot.on::before { color: #54AB64; }
  section { padding: 12px 16px; }
  h3 { margin: 4px 0 6px; font-size: 11px; color: #6b7686; text-transform: uppercase; letter-spacing: .04em; }
  .media { background: #fff; border-radius: 8px; margin: 8px 0; padding: 10px 12px; display: flex; gap: 8px; align-items: center; }
  .media div { flex: 1; min-width: 0; }
  .media small { display: block; color: #6b7686; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .media .sz { font-weight: 700; }
  .media .est { font-size: 10px; font-weight: 700; color: #57606e; background: #eef1f5; border-radius: 3px; padding: 0 4px; margin-left: 4px; }
  .media .acts { display: flex; gap: 4px; align-items: center; flex: none; }
  .media .mini { background: #eef1f5; color: #3570A6; border: 1px solid #d5dbe4; padding: 5px 8px; font-size: 12.5px; font-weight: 600; }
  .media .mini:hover { background: #E9F1F8; }
  button:focus-visible { outline: 2px solid #3570A6; outline-offset: 1px; }
  button { background: #3570A6; color: #fff; border: 0; border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; }
  button:hover { background: #2F6395; }
  .empty { color: #6b7686; }
  .switch { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: #fff; border-bottom: 1px solid #e6eaf0; font-size: 13px; }
  .switch b { font-weight: 600; }
  .switch small { display: block; color: #6b7686; font-size: 11.5px; }
  .switch label { margin-left: auto; position: relative; width: 40px; height: 22px; flex: none; cursor: pointer; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch .knob { position: absolute; inset: 0; background: #b9c0cb; border-radius: 11px; transition: background .15s; }
  .switch .knob::before { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked + .knob { background: #2E7D3F; }
  .switch input:checked + .knob::before { transform: translateX(18px); }
  .switch input:focus-visible + .knob { outline: 2px solid #3570A6; outline-offset: 2px; }
  body.off section, body.off .size { opacity: .45; pointer-events: none; }
  .size { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: #fff; border-bottom: 1px solid #e6eaf0; font-size: 13px; color: #6b7686; }
  .size input[type=range] { flex: 1; accent-color: #3570A6; }
  .size select { margin-left: auto; padding: 2px 6px; border: 1px solid #d5dbe4; border-radius: 6px; font: inherit; }
  .size output { min-width: 40px; text-align: right; color: #1f2733; font-variant-numeric: tabular-nums; }
  .size .reset { background: none; color: #3570A6; padding: 0 2px; font-size: 12px; }
  .size .reset:hover { background: none; text-decoration: underline; }
  .check { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: #fff; border-bottom: 1px solid #e6eaf0; font-size: 13px; color: #6b7686; cursor: pointer; }
  .check input { accent-color: #3570A6; margin: 0; }
  body.off .check { opacity: .45; pointer-events: none; }
  .media .all { background: #E9F1F8; color: #3570A6; }
  .media .all:hover { background: #DCE8F4; color: #2F6395; }
  .open { margin-top: 8px; }
</style>
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="">
    <b>Ezoo Download Manager</b>
    <span class="dot" id="status">checking…</span>
    <button class="gear" id="settings" title="Settings">⚙</button>
  </header>
  <div class="switch">
    <div>
      <b id="onText">Ezoo Download Manager is on</b>
      <small id="onHint">Downloads and videos of this browser go to Ezoo Download Manager</small>
    </div>
    <label title="Turn the add-in on or off">
      <input type="checkbox" id="enabled" checked aria-label="Ezoo Download Manager on / off">
      <span class="knob"></span>
    </label>
  </div>
  <div class="size">
    <span>Download button size</span>
    <input type="range" id="scale" min="50" max="200" step="5" value="100" aria-label="Download button size">
    <output id="scaleText">100%</output>
    <button class="reset" id="scaleReset" title="Back to normal size">Reset</button>
  </div>
  <div class="size">
    <span>Button style</span>
    <select id="look" aria-label="Button style">
      <option value="compact">Small (arrow + ✕)</option>
      <option value="blue">Blue</option>
      <option value="dark">Dark</option>
      <option value="light">Light</option>
      <option value="green">Green</option>
      <option value="icon">Icon only</option>
    </select>
  </div>
  <div class="size">
    <span>Button see-through</span>
    <input type="range" id="solid" min="20" max="100" step="5" value="90" aria-label="How solid the download button is">
    <output id="solidText">90%</output>
  </div>
  <label class="check">
    <input type="checkbox" id="fullscreen" />
    <span>Show the video button in full screen too</span>
  </label>
  <section>
    <h3>Media on this page</h3>
    <div id="media"><div class="empty">Nothing detected yet. Start playing the video.</div></div>
  </section>
  <script src="popup.js"></script>
</body>
</html>
