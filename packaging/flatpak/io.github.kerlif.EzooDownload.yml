# Ezoo Download — Flatpak manifest (fork build, v1.1.1)
#
# App ID: io.github.kerlif.EzooDownload (fork of Ahmed Ezzat's Ezoo
# Download; the author credit is kept — see the metainfo file and
# docs/FLATPAK.md). Built only in GitHub Actions CI (see
# .github/workflows/linux-release.yml):
#   flatpak-builder --force-clean --user --install-deps-from=flathub \
#       --repo=flatpak-repo flatpak-build \
#       packaging/flatpak/io.github.kerlif.EzooDownload.yml
#   flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
#       flatpak-repo dist/EzooDownload-x86_64.flatpak io.github.kerlif.EzooDownload
#
# Runtime 26.08: verified 2026-10-28 — the Flathub refs
# runtime/org.freedesktop.Platform/x86_64/26.08,
# runtime/org.freedesktop.Sdk/x86_64/26.08 and
# runtime/org.freedesktop.Sdk.Extension.rust-stable/x86_64/26.08 all
# resolve (HTTP 200), the freedesktop-sdk GitLab repo has a
# release/26.08 branch, Flathub lists freedesktop-sdk-26.08.4 as the
# latest Platform release, and the rust-stable extension's 26.08
# branch ships Rust 1.99.1 (freedesktop-sdk 26.08.4, 2026-10-26, per
# the Phase 8 review). 24.08 is end-of-life and is NOT used.
#
# Permissions (see docs/FLATPAK.md for the evidence behind each):
#   --device=dri            OpenGL rendering (Slint femtovg renderer)
#   --share=ipc             X11 MIT-SHM for the software-renderer
#                           fallback (softbuffer 0.4.8 X11 backend uses
#                           XCB SHM; see docs/FLATPAK.md §3)
#   --share=network         downloads + the localhost browser bridge
#                           (shares the host network namespace, so the
#                           host browser reaches 127.0.0.1:9614)
#   --socket=wayland / --socket=fallback-x11
#                           Wayland first, X11 when Wayland is absent
#   --filesystem=xdg-download
#                           the default download folder (Settings
#                           defaults to the XDG Downloads directory;
#                           downloads land there without a chooser)
#   --talk-name=org.freedesktop.portal.*
#                           FileChooser portal (rfd file/folder dialogs)
#   --talk-name=org.kde.StatusNotifierWatcher
#                           system-tray icon (tray-icon ksni over D-Bus)
# Deliberately NOT granted: no home/host filesystem access, no
# session-bus blanket access, no PulseAudio socket (event sounds
# spawn paplay/aplay and fail silently when absent — by design).
#
# ffmpeg: NO ffmpeg-full stanza. That extension was retired for
# Freedesktop 25.08+ (its codecs moved to the codecs-extra extension,
# which the runtime installs automatically; the
# runtime/org.freedesktop.Platform.codecs-extra/x86_64/26.08-extra
# ref resolves, while ffmpeg-full refs 404 for 25.08/26.08). Instead
# the `ffmpeg` module below bundles the johnvansickle static build
# (7.0.2-static) at /app/lib/ezoo-download/ffmpeg — the app's own
# search path (tools.rs tool_dirs/ours_ffmpeg), so no code change
# was needed. The tarball URL is a moving alias pinned by SHA-256
# (verified 2026-11-01: abda8d77ce8309141f83ab8edf0596834087c52467f6
# badf376a6a2a4c87cf67); mirror it to an immutable URL before any
# Flathub submission or if the alias changes (docs/OPEN-QUESTIONS.md).
# The .deb/.rpm/AppImage keep their bundled ffmpeg (unchanged).
#
# aria2: the `aria2` module below builds aria2 1.37.0 from source
# (official GitHub release tarball, SHA-256 verified 2026-11-01)
# and installs aria2c at /app/bin/aria2c, so torrents work in the
# Flatpak. The build is time-boxed: if the module does not build in
# the proof run, Fallback B applies — the torrent bullet is removed
# from the metainfo and torrents are documented as unavailable in
# the Flatpak (docs/FLATPAK.md, README, site). The app never fetches
# aria2 on Linux; only Windows fetches it (tools.rs aria2()).
#
# yt-dlp: NOT shipped (see docs/FLATPAK.md §6 and Open Question 1,
# resolved). The app fetches a hash-checked yt-dlp_linux into its
# sandbox data directory itself (tools.rs), exactly as on other
# Linux installs; no manual user install is needed.
#
# Cargo sources: packaging/flatpak/cargo-sources.json, generated
# offline from the CURRENT Cargo.lock with flatpak-cargo-generator
# (flatpak-builder-tools, commit 41c20aa10819cdb2a4f3ca171758a96d1955c018).
# Regenerate it whenever Cargo.lock changes; the build runs fully
# offline (CARGO_NET_OFFLINE=true, --offline --locked).

id: io.github.kerlif.EzooDownload
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: EzooDownload
finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.portal.*
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  # Static ffmpeg (johnvansickle 7.0.2-static). The source URL is a
  # moving alias pinned by its SHA-256 below (verified 2026-11-01
  # against the review value and packaging/linux/fetch-ffmpeg.sh).
  # Installs to /app/lib/ezoo-download/ffmpeg — the app's own search
  # path (tools.rs tool_dirs/ours_ffmpeg) — with the version line,
  # the GPLv3 text from the tarball, and the GPLv3 source offer.
  - name: ffmpeg
    buildsystem: simple
    build-commands:
      - tar -xJf ffmpeg-release-amd64-static.tar.xz
      - install -Dm755 ffmpeg-7.0.2-amd64-static/ffmpeg ${FLATPAK_DEST}/lib/ezoo-download/ffmpeg
      - install -Dm644 ffmpeg-7.0.2-amd64-static/GPLv3.txt ${FLATPAK_DEST}/share/doc/ezoo-download/ffmpeg/ffmpeg-LICENSE.txt
      - ./ffmpeg-7.0.2-amd64-static/ffmpeg -hide_banner -version 2>/dev/null | head -1 > ${FLATPAK_DEST}/share/doc/ezoo-download/ffmpeg/ffmpeg-version.txt
      - install -Dm644 SOURCE-OFFER.txt ${FLATPAK_DEST}/share/doc/ezoo-download/ffmpeg/SOURCE-OFFER.txt
    sources:
      - type: file
        url: https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
        sha256: abda8d77ce8309141f83ab8edf0596834087c52467f6badf376a6a2a4c87cf67
      - type: file
        path: ffmpeg-SOURCE-OFFER.txt
        dest-filename: SOURCE-OFFER.txt
  # aria2 1.37.0 from source (official GitHub release tarball,
  # SHA-256 verified 2026-11-01 against the release asset and the
  # Gentoo Manifest). The app only uses aria2 for torrents/magnets
  # (RPC methods addUri, tellStatus, forceRemove, removeDownloadResult,
  # getFiles — see crates/engine/src/torrent.rs), so the build drops
  # what it never uses: metalink (and with it libxml2/expat), the
  # websocket RPC transport (HTTP JSON-RPC only), SFTP (libssh2),
  # sqlite3 (cookie import only), async DNS (libcares), and NLS.
  # TLS stays OpenSSL (gnutls/nettle disabled); zlib stays. libaria2
  # stays off (default). If this module does not build in the proof
  # run, Fallback B applies (see the header comment above).
  - name: aria2
    buildsystem: autotools
    config-opts:
      - --disable-nls
      - --disable-metalink
      - --disable-websocket
      - --without-gnutls
      - --without-libnettle
      - --without-sqlite3
      - --without-libxml2
      - --without-libexpat
      - --without-libcares
      - --without-libssh2
    post-install:
      # Loud check: the build must actually have BitTorrent and HTTPS
      # support, or the proof run would ship a torrent-less binary
      # that claims otherwise.
      - ${FLATPAK_DEST}/bin/aria2c --version | grep -q BitTorrent
      - ${FLATPAK_DEST}/bin/aria2c --version | grep -q HTTPS
      - install -Dm644 COPYING ${FLATPAK_DEST}/share/doc/ezoo-download/aria2-COPYING.txt
    sources:
      - type: archive
        url: https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0.tar.xz
        sha256: 60a420ad7085eb616cb6e2bdf0a7206d68ff3d37fb5a956dc44242eb2f79b66b
  - name: ezoo-download
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/ezoo-download/cargo
        CARGO_NET_OFFLINE: "true"
    build-commands:
      # Offline release build from the vendored sources. The SDK's
      # fontconfig/freetype/xkbcommon/X11/xcb development files cover
      # Slint's Linux backends; TLS is rustls (no OpenSSL headers
      # needed) and the fonts are embedded in the binary, so no
      # extra modules are required. Slint's build script compiles
      # ui/app.slint (build.rs) exactly as the .deb/AppImage builds do.
      - cargo --offline build --release --locked
      - install -Dm755 target/release/EzooDownload ${FLATPAK_DEST}/bin/EzooDownload
      - install -Dm644 packaging/flatpak/io.github.kerlif.EzooDownload.desktop ${FLATPAK_DEST}/share/applications/io.github.kerlif.EzooDownload.desktop
      - install -Dm644 packaging/flatpak/io.github.kerlif.EzooDownload.metainfo.xml ${FLATPAK_DEST}/share/metainfo/io.github.kerlif.EzooDownload.metainfo.xml
      # hicolor icons (only this app's icons live in this tree)
      - mkdir -p ${FLATPAK_DEST}/share/icons/hicolor
      - cp -a packaging/linux/hicolor/. ${FLATPAK_DEST}/share/icons/hicolor/
      # Browser-extension sources, mirroring the .deb layout: the app
      # looks for them at <exe>/../share/ezoo-download/ (browser.rs
      # extension_dir), which is /app/share/ezoo-download/ here.
      - mkdir -p ${FLATPAK_DEST}/share/ezoo-download
      - cp -a extension ${FLATPAK_DEST}/share/ezoo-download/extension
      - rm -rf ${FLATPAK_DEST}/share/ezoo-download/extension/test
      - cp -a extension ${FLATPAK_DEST}/share/ezoo-download/extension-firefox
      - mv ${FLATPAK_DEST}/share/ezoo-download/extension-firefox/manifest.firefox.json ${FLATPAK_DEST}/share/ezoo-download/extension-firefox/manifest.json
      - rm -rf ${FLATPAK_DEST}/share/ezoo-download/extension-firefox/test
      # Licences and notices, mirroring the .deb's doc directory.
      - mkdir -p ${FLATPAK_DEST}/share/doc/ezoo-download
      - cp THIRD-PARTY-NOTICES.txt README.md ${FLATPAK_DEST}/share/doc/ezoo-download/
      - cp crates/app/ui/fonts/OFL-Carlito.txt crates/app/ui/fonts/OFL-NotoSansArabic.txt crates/app/ui/fonts/OFL-LiberationSerif.txt ${FLATPAK_DEST}/share/doc/ezoo-download/
    sources:
      # The whole checked-out tree (paths are relative to this file).
      # Build from a clean tree: flatpak-builder copies the directory
      # as-is, so a local target/ or dist/ would be copied too. CI
      # runs this step before any cargo/packaging step for that reason.
      - type: dir
        path: ../..
      - cargo-sources.json
