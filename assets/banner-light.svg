<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">Ezoo Download Manager</title>
  <desc id="d">Illustration of several download segments filling in parallel.</desc>
  <style>
    .title { font: 600 44px "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif; fill: #1D283A; }
    .tag { font: 400 22px "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif; fill: #363940; }
    .track { fill: #DCE5EC; }
    .seg { fill: #54AB64; transform-box: fill-box; transform-origin: 0% 50%; animation: fill 6s ease-in-out infinite both; }
    .seg.hot { fill: #C2453F; }
    @keyframes fill { 0% { transform: scaleX(0); } 60%, 100% { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { .seg { animation: none; transform: scaleX(1); } }
  </style>
  <rect width="1200" height="360" fill="#F3F6F8"/>
  <g transform="translate(110 70) scale(0.1875)">
  <defs>
    <linearGradient id="edm-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#253149"/>
      <stop offset="1" stop-color="#1D283A"/>
    </linearGradient>
    <linearGradient id="edm-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset=".38" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- tile: navy gradient, left #253149 -> right #1D283A -->
  <rect width="512" height="512" rx="82" fill="url(#edm-bg)"/>
  <rect width="512" height="512" rx="82" fill="url(#edm-sheen)"/>
  <!-- E #4687C7 -->
  <g fill="#4687C7">
    <rect x="56" y="179" width="34" height="167" rx="8"/>
    <rect x="56" y="179" width="104" height="34" rx="8"/>
    <rect x="56" y="245" width="78" height="34" rx="8"/>
    <rect x="56" y="312" width="104" height="34" rx="8"/>
  </g>
  <!-- D #54AB64: bowl + download-arrow stem -->
  <g fill="#54AB64">
    <rect x="167" y="179" width="34" height="121"/>
    <polygon points="153,296 215,296 184,346"/>
    <path fill-rule="evenodd" d="M167 179 H238 Q302 179 302 262 Q302 346 238 346 H167 Z M201 213 H236 Q268 213 268 262 Q268 311 236 311 H201 Z"/>
  </g>
  <!-- M #C2453F -->
  <polygon fill="#C2453F" points="311,179 345,179 387,264 429,179 463,179 463,346 429,346 429,250 387,332 345,250 345,346 311,346"/>
  <!-- GitHub badge (simplified octocat), bottom-right, as in the supplied logo -->
  <g>
    <circle cx="425" cy="450" r="44" fill="#0D1117"/>
    <polygon fill="#ffffff" points="404,430 411,406 421,428"/>
    <polygon fill="#ffffff" points="429,428 439,406 446,430"/>
    <circle cx="425" cy="446" r="24" fill="#ffffff"/>
    <circle cx="416" cy="444" r="3.2" fill="#0D1117"/>
    <circle cx="434" cy="444" r="3.2" fill="#0D1117"/>
  </g>
  </g>
  <text x="110" y="222" class="title">Ezoo Download Manager</text>
  <text x="110" y="262" class="tag">Multi-connection, resumable downloads</text>
  <text x="110" y="292" class="tag">for Windows and Linux</text>
  <g>
    <rect class="track" x="640" y="96" width="480" height="18" rx="9"/>
    <rect class="seg" x="640" y="96" width="112" height="18" rx="9" style="animation-delay:0.0s"/>
    <rect class="seg" x="762" y="96" width="112" height="18" rx="9" style="animation-delay:0.7s"/>
    <rect class="seg" x="884" y="96" width="112" height="18" rx="9" style="animation-delay:1.4s"/>
    <rect class="seg" x="1006" y="96" width="112" height="18" rx="9" style="animation-delay:2.1s"/>
    <rect class="track" x="640" y="140" width="480" height="18" rx="9"/>
    <rect class="seg" x="640" y="140" width="112" height="18" rx="9" style="animation-delay:0.4s"/>
    <rect class="seg" x="762" y="140" width="112" height="18" rx="9" style="animation-delay:1.1s"/>
    <rect class="seg hot" x="884" y="140" width="112" height="18" rx="9" style="animation-delay:1.8s"/>
    <rect class="seg" x="1006" y="140" width="112" height="18" rx="9" style="animation-delay:2.5s"/>
    <rect class="track" x="640" y="184" width="480" height="18" rx="9"/>
    <rect class="seg" x="640" y="184" width="112" height="18" rx="9" style="animation-delay:0.8s"/>
    <rect class="seg" x="762" y="184" width="112" height="18" rx="9" style="animation-delay:1.5s"/>
    <rect class="seg" x="884" y="184" width="112" height="18" rx="9" style="animation-delay:2.2s"/>
    <rect class="seg" x="1006" y="184" width="112" height="18" rx="9" style="animation-delay:2.9s"/>
    <rect class="track" x="640" y="228" width="480" height="18" rx="9"/>
    <rect class="seg" x="640" y="228" width="112" height="18" rx="9" style="animation-delay:1.2s"/>
    <rect class="seg hot" x="762" y="228" width="112" height="18" rx="9" style="animation-delay:1.9s"/>
    <rect class="seg" x="884" y="228" width="112" height="18" rx="9" style="animation-delay:2.6s"/>
    <rect class="seg" x="1006" y="228" width="112" height="18" rx="9" style="animation-delay:3.3s"/>
    <rect class="track" x="640" y="272" width="480" height="18" rx="9"/>
    <rect class="seg" x="640" y="272" width="112" height="18" rx="9" style="animation-delay:1.6s"/>
    <rect class="seg" x="762" y="272" width="112" height="18" rx="9" style="animation-delay:2.3s"/>
    <rect class="seg" x="884" y="272" width="112" height="18" rx="9" style="animation-delay:3.0s"/>
    <rect class="seg" x="1006" y="272" width="112" height="18" rx="9" style="animation-delay:3.7s"/>
  </g>
</svg>
