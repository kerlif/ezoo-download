name: Linux release (deb / AppImage / rpm + extensions)

# Linux packages and browser extensions, built directly after every source
# update — no manual packaging step. The Windows setup keeps its own
# workflow (build.yml); this file is Linux + extensions only.
#
# Triggers:
#   - push to main or linux-support: build, upload artifacts (no release)
#   - push of a tag v*: build, then create a GitHub Release with every
#     asset + SHA256SUMS.txt (the tag MUST match Cargo.toml's version)
#   - workflow_dispatch: manual run, artifacts only
#
# Flatpak was deleted in P8-bis (2026-11-08, the maintainer's decision: "احذف
# Flatpak الآن"): no Flatpak bundle is built or shipped in v1.1.2.
# The packaging files (packaging/flatpak/) and docs/FLATPAK.md were
# removed from the tree (copies kept in ~/workspace/ezoo/v112/
# flatpak-backup-2026-11-08/); the released v1.1.1 Flatpak asset on
# GitHub is untouched, and the app still detects a Flatpak install
# at runtime (tools.rs: in_flatpak) for the copies already out there.
#
# Secrets (all optional; the build never fails for a missing one, it just
# skips the signed artifact and says so):
#   - UPDATE_SIGNING_KEY: Ed25519 key signing SHA256SUMS.txt on tag
#     releases. It lives in the GitHub environment `release-signing`
#     (NOT a repository secret) with required reviewers (P8-sexies,
#     2026-11-08): this job waits for a reviewer's approval before
#     it starts, on tag runs AND on main-push runs. Until the
#     environment is created and the key moved into it, the
#     repository secret of the same name is used instead and the job
#     runs ungated — the workflow change alone protects nothing.
#   - CRX_PRIVATE_KEY: the PEM private key that owns the Chrome extension
#     id bilpkcfhiogfelpdfpgmnjkpblgmcbkd. With it, a signed .crx is
#     produced; without it, only the unsigned .zip is shipped.
#   - AMO_JWT_ISSUER / AMO_JWT_SECRET: addons.mozilla.org API keys. On tag
#     releases only, the Firefox add-on is signed by Mozilla (permanent
#     install); otherwise the unsigned .xpi ships, as documented in
#     README-Linux.md.

on:
  push:
    branches: [main, linux-support]
    tags: ["v*"]
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    # Signing key comes from the `release-signing` environment
    # (required reviewers): this job waits for a reviewer's approval
    # before it starts, on tag runs AND on main-push runs, because
    # the gate is at job level (P8-sexies; see §15 of
    # docs/UPDATE-CHECKER.md). The key is used only by the
    # tag-only "Sign SHA256SUMS.txt" step; on non-tag runs the job
    # still waits, it just never signs. Until the environment
    # exists with the key moved into it, the repository secret of
    # the same name is used instead and the job runs ungated.
    environment: release-signing
    steps:
      # actions pinned to exact commits (a moved tag can't change the build),
      # same pins as the Windows workflow (build.yml)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          # Build tools + the -dev counterparts of the .deb's runtime
          # Depends (debian/control) + dpkg/rpm packaging tools. Slint's
          # Linux backends need fontconfig, freetype, xkbcommon, X11 and
          # xcb headers; the first CI run confirms the exact set.
          # libsecret-1-dev (P8-bis: Secret Service storage) lives in
          # universe on Ubuntu — the runners have it enabled by default.
          sudo apt-get install -y -q build-essential pkg-config libssl-dev \
            libfontconfig-dev libfreetype-dev libxkbcommon-dev libx11-dev \
            libxcb1-dev zlib1g-dev dpkg-dev rpm curl xz-utils zip file \
            libsecret-1-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Check the version (tag must match Cargo.toml)
        run: |
          VERSION="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            [ "$TAG" = "v$VERSION" ] || { echo "::error::Tag $TAG does not match version $VERSION in Cargo.toml"; exit 1; }
          fi
          echo "Building Ezoo Download Manager $VERSION for Linux"

      - name: Run extension tests
        run: |
          node extension/test/yt-core.test.js
          node extension/test/background.sim.js

      - name: Build (release, locked)
        run: cargo build --release --locked

      - name: Run engine tests (failures warn, they never block packaging)
        run: |
          cargo test -p swiftget-engine --no-fail-fast 2>&1 | tee tests.txt || true
          if grep -Eq '^error(\[|:)|panicked at|^test .* FAILED$' tests.txt; then
            echo "::warning::engine tests failed (see the log above)"
          fi

      - name: Package deb + AppImage + rpm (ffmpeg bundled inside)
        env:
          SKIP_CARGO_BUILD: "1"
        run: bash ./packaging/linux/build-linux.sh all

      - name: Package browser extensions (.zip, .xpi, .crx when keyed)
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: bash ./packaging/linux/build-extensions.sh dist

      # Firefox keeps only add-ons signed by Mozilla; a version can be
      # signed once, so this runs for a tag release only, like build.yml.
      - name: Sign the Firefox add-on (tag releases, when AMO keys exist)
        if: github.ref_type == 'tag'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          EXT_VERSION="$(python3 -c "import json;print(json.load(open('extension/manifest.firefox.json'))['version'])")"
          SIGNED="extension-signed/ezoo-download-firefox-$EXT_VERSION.xpi"
          if [ -f "$SIGNED" ]; then
            echo "Add-on $EXT_VERSION already signed, reusing $SIGNED"
            cp "$SIGNED" "dist/ezoo-download-firefox-$EXT_VERSION.xpi"
          elif [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::warning::AMO_JWT_ISSUER / AMO_JWT_SECRET are not set: the Firefox add-on is not signed"
            exit 0
          else
            rm -rf fx-stage && mkdir fx-stage
            cp -r extension/. fx-stage/
            rm -rf fx-stage/test
            mv fx-stage/manifest.firefox.json fx-stage/manifest.json
            npx --yes web-ext@8.10.0 sign --channel=unlisted --source-dir fx-stage \
              --artifacts-dir xpi-out --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" \
              --approval-timeout 900000
            XPI="$(ls xpi-out/*.xpi 2>/dev/null | head -1 || true)"
            [ -n "$XPI" ] || { echo "::warning::the Firefox add-on was not signed"; exit 0; }
            cp "$XPI" "dist/ezoo-download-firefox-$EXT_VERSION.xpi"
          fi
          printf '{\n  "addons": {\n    "ezoo-download@ezoo-tech.com": {\n      "updates": [\n        { "version": "%s", "update_link": "https://github.com/%s/releases/download/v%s/ezoo-download-firefox-%s.xpi" }\n      ]\n    }\n  }\n}\n' \
            "$EXT_VERSION" "${{ github.repository }}" "$VERSION" "$EXT_VERSION" > dist/firefox-updates.json

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Sign SHA256SUMS.txt (release only)
        if: github.ref_type == 'tag'
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          # the updater verifies SHA256SUMS.txt.sig when the release
          # carries it (selfupdate.rs: sums_signature_ok), so a
          # tampered sums file cannot bless a tampered artifact (Q12/Q33).
          # Same key and example as version.json; a missing key is a
          # hard error on releases, exactly like the version.json rule.
          if [ -z "$UPDATE_SIGNING_KEY" ]; then echo "UPDATE_SIGNING_KEY is not set: refusing to ship an unsigned SHA256SUMS.txt for a release" >&2; exit 1; fi
          SUMS_HASH=$(sha256sum dist/SHA256SUMS.txt | awk '{print $1}')
          SUMS_SIG=$(cargo run --quiet --release -p swiftget-engine --example sign_update -- "$VERSION" "$SUMS_HASH")
          if [ ${#SUMS_SIG} -ne 128 ]; then echo "could not sign SHA256SUMS.txt" >&2; exit 1; fi
          printf '%s\n' "$SUMS_SIG" > dist/SHA256SUMS.txt.sig
          cat dist/SHA256SUMS.txt.sig

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: EzooDownload-linux-${{ env.VERSION }}
          path: dist/*
          retention-days: 30

      - name: Publish release (tags only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            && { echo "v$VERSION is already released"; exit 0; }
          NOTES="Ezoo Download Manager $VERSION for Linux: .deb, AppImage, .rpm (ffmpeg bundled inside) plus the Chrome (.crx/.zip) and Firefox (.xpi) extensions."
          gh release create "v$VERSION" dist/* --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" --title "Ezoo Download Manager $VERSION (Linux)" \
            --notes "$NOTES"
