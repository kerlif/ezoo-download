name: Windows release (Setup.exe + updater files)

# The real Windows release: EzooDownload-Setup.exe (Inno Setup 6, per-user,
# no admin), built from the same proven steps as build.yml's windows job
# and uploaded to the GitHub Release — automatically, on every tag.
#
# The release and the updater announcement are SEPARATE steps
# (2026-11-08, the maintainer's decision): the tag run publishes
# every file EXCEPT version.json, the manifest the in-app updater
# reads. version.json is published later by the
# publish-updater-manifest dispatch job in this file, and ONLY after
# the 1.1.2 browser extension is approved in BOTH stores (Chrome Web
# Store + AMO). Until then installed copies see no update at all: a
# release without the manifest asset is a silent fail in the updater
# (selfupdate.rs), never an offer and never an error. The manifest is
# derived from the PUBLISHED Setup.exe (downloaded from the release
# and hashed by the dispatch job) — never from a rebuild — so its
# sha256 always matches the file users download.
#
# Triggers:
#   - push to main or linux-support: build, upload artifacts (no release)
#   - push of a tag v*: build, then upload the setup + updater files to
#     the release (the tag MUST match Cargo.toml's version). The release
#     itself is created by the Linux workflow; this job waits for it
#     (up to 10 minutes) and never deletes anything.
#   - workflow_dispatch: manual run from main only (any other ref fails
#     fast below); the windows job builds and uploads run artifacts
#     only — it NEVER touches a release. The old v1.0.7 backfill use
#     case (dispatch uploading to an existing release with --clobber)
#     is closed: it could silently replace published release files.
#     The publish-updater-manifest job below is the ONLY dispatch that
#     uploads to a release, and only version.json, only after both
#     stores approve the extension.
#
# Secrets:
#   - UPDATE_SIGNING_KEY: Ed25519 key signing version.json and
#     SHA256SUMS-windows.txt; installed copies accept only signed
#     updates. It lives in the GitHub environment `release-signing`
#     (NOT a repository secret) with required reviewers, so every job
#     that uses it waits for a reviewer's approval before it starts
#     (P8-sexies, 2026-11-08, the maintainer's decision). Until the
#     environment is created and the key moved into it, the jobs below
#     still read the repository secret of the same name and run
#     ungated — the workflow change alone protects nothing. REQUIRED
#     on releases: a release build FAILS without it
#     (docs/UPDATE-CHECKER.md §10) instead of shipping version.json
#     with an empty signature. On non-release runs the key is still
#     optional (unsigned version.json, warning only).
#     Consequence the maintainer accepted: EVERY run of a job that
#     consumes the key — tag runs AND main-push runs — pauses for
#     review, because the gate is at job level and cannot be scoped
#     to the signing step (see docs/UPDATE-CHECKER.md §15).
#   - AMO_JWT_ISSUER / AMO_JWT_SECRET: <redacted>
#     per version; otherwise the unsigned path is skipped with a warning
#     (the Linux workflow already ships the .xpi).

on:
  push:
    branches: [main, linux-support]
    tags: ["v*"]
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to announce (without the leading v)"
        required: true
        default: "1.1.2"
      extension_approved_in_both_stores:
        description: "The 1.1.2 extension is approved in the Chrome Web Store AND AMO"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Ezoo Download Manager's own small ffmpeg (tools/ffmpeg/build.sh): built from the
  # official sources, both checked (exact commit / SHA-256), kept in the cache
  # until the script or a version changes. Same job as build.yml (shared cache).
  ffmpeg:
    runs-on: ubuntu-24.04
    env:
      FFMPEG_TAG: n8.0.3
      FFMPEG_COMMIT: 8ae0b34901ba60a802f183ee75a250a9fc3e09a5
      LAME_URL: https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz
      LAME_SHA256: ddfe36cab873794038ae2c1210557ad34857a4b6bdc515785d1da9e175b1da1e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ffmpeg-out
          key: ffmpeg-${{ env.FFMPEG_COMMIT }}-lame-${{ env.LAME_SHA256 }}-${{ hashFiles('tools/ffmpeg/build.sh') }}
      - name: Build ffmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mingw-w64 nasm pkg-config make
          git clone -q --depth 1 --branch "$FFMPEG_TAG" https://github.com/FFmpeg/FFmpeg ffmpeg-src
          test "$(git -C ffmpeg-src rev-parse HEAD)" = "$FFMPEG_COMMIT" || { echo "::error::ffmpeg source is not the expected commit"; exit 1; }
          curl -sSfL -o lame.tar.gz "$LAME_URL"
          echo "$LAME_SHA256  lame.tar.gz" | sha256sum -c -
          tar xzf lame.tar.gz
          CC=x86_64-w64-mingw32-gcc bash tools/ffmpeg/build.sh ffmpeg-src lame-3.100 ffmpeg-out
          echo "$FFMPEG_TAG ($FFMPEG_COMMIT), LAME 3.100" > ffmpeg-out/ffmpeg-version.txt
      - name: Test files for our ffmpeg (made with the system's full ffmpeg)
        run: |
          sudo apt-get install -y -q ffmpeg >/dev/null
          mkdir -p ffmpeg-test && cd ffmpeg-test
          F="ffmpeg -hide_banner -loglevel error -y"
          V="-f lavfi -i testsrc2=size=320x180:rate=25:duration=4"; A="-f lavfi -i sine=frequency=500:duration=4:sample_rate=48000"
          $F $V -c:v libx264 -an -movflags +frag_keyframe+empty_moov -f mp4 v.mp4
          $F $A -c:a aac -vn -movflags +frag_keyframe+empty_moov -f mp4 a.m4a
          $F $V -c:v libvpx-vp9 -deadline realtime -an -f webm v.webm
          $F $A -c:a libopus -vn -f webm a.webm
          $F $V $A -c:v libx264 -c:a aac -f mpegts s.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ffmpeg
          path: ffmpeg-out
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ffmpeg-test
          path: ffmpeg-test
          retention-days: 3

  windows:
    needs: ffmpeg
    runs-on: windows-latest
    # Signing key comes from the `release-signing` environment
    # (required reviewers): this job waits for a reviewer's approval
    # before it starts, on tag runs AND on main-push runs, because the
    # gate is at job level (P8-sexies; see §15 of
    # docs/UPDATE-CHECKER.md). Until the environment exists with the
    # key moved into it, the repository secret of the same name is
    # used instead and the job runs ungated.
    environment: release-signing
    steps:
      # actions pinned to exact commits (a moved tag can't change the build)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Manual dispatch is main-only: a dispatch from any other ref
      # fails here, before any build or signing step runs. (Dispatch
      # can no longer publish — see the publish step below — but a
      # branch build must not consume the release signing keys.)
      - name: Guard manual dispatch to main
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "main") { throw "workflow_dispatch is restricted to main (got ref '${{ github.ref_name }}')" }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ffmpeg
          path: ffmpeg-out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ffmpeg-test
          path: ffmpeg-test
      - name: Check our ffmpeg (everything Ezoo Download Manager asks of it)
        shell: pwsh
        run: |
          $ff = "ffmpeg-out/ffmpeg.exe"; $t = "ffmpeg-test"
          function Run([string[]]$a, $out) {
            & $ff -hide_banner -loglevel error -y @a $out
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $out) -or (Get-Item $out).Length -lt 1000) { throw "our ffmpeg failed: $($a -join ' ') $out" }
          }
          Run @("-i", "$t/v.mp4", "-i", "$t/a.m4a", "-map", "0:v:0", "-map", "1:a:0", "-c", "copy", "-movflags", "+faststart", "-f", "mp4") "$t/o1.mp4"
          Run @("-i", "$t/v.webm", "-i", "$t/a.webm", "-map", "0:v:0", "-map", "1:a:0", "-c", "copy", "-f", "webm") "$t/o2.webm"
          Run @("-i", "$t/a.webm", "-vn", "-map", "0:a:0", "-c:a", "libmp3lame", "-b:a", "192k", "-f", "mp3") "$t/o3.mp3"
          Run @("-f", "mpegts", "-i", "$t/s.ts", "-map", "0:v?", "-map", "0:a?", "-c", "copy", "-movflags", "+faststart", "-f", "mp4") "$t/o4.mp4"
          $n = (Get-Item "$t/v.mp4").Length / 2
          Run @("-protocol_whitelist", "file,subfile", "-i", "subfile,,start,0,end,$n,,:$((Resolve-Path "$t/v.mp4").Path)", "-c", "copy", "-f", "matroska") "$t/o5.mkv"
          Write-Host "our ffmpeg: $((Get-Item $ff).Length / 1MB) MB, all checks passed"
      # restore_ffmpeg() fetches ffmpeg.exe from our own release when the
      # bundled copy is missing, and only accepts it when its SHA-256
      # matches the hash baked into the binary at build time
      # (tools.rs: FFMPEG_SHA256, option_env!("EZOO_FFMPEG_SHA256")).
      # The hash comes from the ffmpeg this run built, so it can never
      # go stale; without it restore_ffmpeg() stays inert.
      - name: Bake the ffmpeg.exe SHA-256 into the build
        shell: pwsh
        run: |
          $ffHash = (Get-FileHash ffmpeg-out/ffmpeg.exe -Algorithm SHA256).Hash.ToLower()
          "EZOO_FFMPEG_SHA256=$ffHash" | Out-File -Append $env:GITHUB_ENV
          Write-Host "ffmpeg.exe SHA-256 baked in: $ffHash"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Run extension tests
        run: |
          node extension/test/yt-core.test.js
          node extension/test/background.sim.js
      - name: Run engine tests
        shell: pwsh
        run: |
          cargo test -p swiftget-engine --no-fail-fast 2>&1 | Tee-Object -FilePath tests.txt
          $code = $LASTEXITCODE
          # failures (only real ones) show up as annotations on the run page;
          # case-sensitive, or every "0 failed" summary line looked like one
          if ($code -ne 0) {
            Select-String -CaseSensitive -Path tests.txt -Pattern "^error(\[|:)|panicked at|^test .* FAILED$|^---- " |
              Select-Object -First 40 | ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
            Write-Host "::warning::engine tests failed (exit $code)"
          }
          exit 0
      # Phase 8: the Linux clippy gate cannot see Windows-only code
      # (winfx.rs, the Windows-only paths in update.rs/fonts.rs), and
      # only the engine crate was tested on Windows. Both steps below
      # fail the job, unlike the warn-only engine step above, which
      # is kept exactly as it was.
      - name: Clippy, all targets (Windows)
        shell: pwsh
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run all tests (app + engine, Windows)
        shell: pwsh
        run: cargo test --locked --no-fail-fast
      - name: Check dependencies for known vulnerabilities
        shell: pwsh
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          # fails on published vulnerabilities; "unmaintained" notices only warn
          cargo audit
      - name: Build release
        run: cargo build --release
      - name: Package
        shell: pwsh
        env:
          # Mozilla add-on keys (addons.mozilla.org > Developer Hub > API keys);
          # with them the Firefox add-on is signed and stays in Firefox for good
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          # Ed25519 key that signs version.json; the program installs only
          # updates signed with it (selfupdate.rs has the public half).
          # Required on releases (a missing key fails the build there);
          # optional on non-release runs (unsigned version.json, warning).
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          IS_RELEASE: ${{ github.ref_type == 'tag' }}
        run: |
          $version = ([regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"')).Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}".TrimStart("v")
            if ($tag -ne $version) { throw "Tag v$tag does not match version $version in Cargo.toml" }
          }
          "VERSION=$version" | Out-File -Append $env:GITHUB_ENV
          # everything for the setup is gathered here; the result is the setup only
          $p = "build-cache/stage"
          New-Item -ItemType Directory -Force "$p/tools", "dist" | Out-Null
          Copy-Item target/release/EzooDownload.exe $p
          Copy-Item THIRD-PARTY-NOTICES.txt $p
          # the bundled fonts' OFL-1.1 texts (Phase 3; installer/ezoo.iss
          # lists them with skipifsourcedoesntexist)
          Copy-Item crates/app/ui/fonts/OFL-Carlito.txt $p
          Copy-Item crates/app/ui/fonts/OFL-NotoSansArabic.txt $p
          Copy-Item crates/app/ui/fonts/OFL-LiberationSerif.txt $p
          Copy-Item -Recurse extension "$p/extension"
          Copy-Item -Recurse extension "$p/extension-firefox"
          Remove-Item -Recurse -Force "$p/extension/test", "$p/extension-firefox/test"
          Copy-Item -Force "$p/extension-firefox/manifest.firefox.json" "$p/extension-firefox/manifest.json"
          Remove-Item -Force "$p/extension-firefox/manifest.firefox.json", "$p/extension/manifest.firefox.json"
          # the add-on has its own version (manifest.firefox.json)
          $extVersion = (Get-Content extension/manifest.firefox.json -Raw | ConvertFrom-Json).version
          # Firefox keeps only add-ons signed by Mozilla; a version can be signed
          # once, so this runs for a release only
          if ($env:IS_RELEASE -eq "true" -and $env:AMO_JWT_ISSUER -and $env:AMO_JWT_SECRET -and -not (Test-Path "extension-signed/ezoo-download-firefox-$extVersion.xpi")) {
            npx --yes web-ext@8.10.0 sign --channel=unlisted --source-dir "$p/extension-firefox" --artifacts-dir xpi-out --api-key "$env:AMO_JWT_ISSUER" --api-secret "$env:AMO_JWT_SECRET" --approval-timeout 900000
            $xpi = Get-ChildItem xpi-out -Filter *.xpi | Select-Object -First 1
            if ($xpi) {
              Copy-Item $xpi.FullName "$p/ezoo-download-firefox.xpi"
              Copy-Item $xpi.FullName "dist/ezoo-download-firefox-$extVersion.xpi"
              $fx = "{`n  ""addons"": {`n    ""ezoo-download@ezoo-tech.com"": {`n      ""updates"": [`n        { ""version"": ""$extVersion"", ""update_link"": ""https://github.com/${{ github.repository }}/releases/download/v$version/ezoo-download-firefox-$extVersion.xpi"" }`n      ]`n    }`n  }`n}`n"
              [IO.File]::WriteAllText("$PWD/dist/firefox-updates.json", $fx)
            } else { Write-Host "::warning::the Firefox add-on was not signed" }
          } elseif ($env:IS_RELEASE -eq "true") { Write-Host "::warning::AMO_JWT_ISSUER / AMO_JWT_SECRET are not set: the Firefox add-on is not signed" }
          # an add-on of this version already signed (by hand on addons.mozilla.org)
          $signed = "extension-signed/ezoo-download-firefox-$extVersion.xpi"
          if (-not (Test-Path "$p/ezoo-download-firefox.xpi") -and (Test-Path $signed)) {
            Copy-Item $signed "$p/ezoo-download-firefox.xpi"
            Copy-Item $signed "dist/ezoo-download-firefox-$extVersion.xpi"
            $fx = "{`n  ""addons"": {`n    ""ezoo-download@ezoo-tech.com"": {`n      ""updates"": [`n        { ""version"": ""$extVersion"", ""update_link"": ""https://github.com/${{ github.repository }}/releases/download/v$version/ezoo-download-firefox-$extVersion.xpi"" }`n      ]`n    }`n  }`n}`n"
            [IO.File]::WriteAllText("$PWD/dist/firefox-updates.json", $fx)
          }
          # our own small ffmpeg (job "ffmpeg") and its licences
          Copy-Item ffmpeg-out/* "$p/tools/"
          # the same ffmpeg.exe as a standalone release asset, so
          # restore_ffmpeg() can fetch it from our own release
          # (tools.rs: releases/download/v<version>/ffmpeg.exe)
          Copy-Item ffmpeg-out/ffmpeg.exe "dist/ffmpeg.exe"
          # yt-dlp of one release, checked against that release's SHA2-256SUMS
          $yt = Invoke-RestMethod "https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest" -Headers @{ "User-Agent" = "EzooDownload-ci"; "Authorization" = "Bearer ${{ github.token }}" }
          $ytExe = $yt.assets | Where-Object { $_.name -eq "yt-dlp.exe" } | Select-Object -First 1
          $ytSums = $yt.assets | Where-Object { $_.name -eq "SHA2-256SUMS" } | Select-Object -First 1
          if (-not $ytExe -or -not $ytSums) { throw "the yt-dlp release has no yt-dlp.exe / SHA2-256SUMS" }
          Invoke-WebRequest $ytExe.browser_download_url -OutFile "$p/tools/yt-dlp.exe"
          $ySumText = (Invoke-WebRequest $ytSums.browser_download_url).Content
          if ($ySumText -is [byte[]]) { $ySumText = [Text.Encoding]::UTF8.GetString($ySumText) }
          $yWant = ($ySumText -split "`n" | Where-Object { $_ -match "^([0-9a-fA-F]{64})\s+\*?yt-dlp\.exe\s*$" } | ForEach-Object { ($_ -split '\s+')[0] } | Select-Object -First 1)
          $yGot = (Get-FileHash "$p/tools/yt-dlp.exe" -Algorithm SHA256).Hash
          if (-not $yWant -or $yGot -ne $yWant.ToUpper()) { throw "yt-dlp.exe does not match its published SHA-256" }
          # aria2 (torrents): one fixed build, checked against its known SHA-256
          Invoke-WebRequest "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip" -OutFile aria2.zip
          if ((Get-FileHash aria2.zip -Algorithm SHA256).Hash -ne "67D015301EEF0B612191212D564C5BB0A14B5B9C4796B76454276A4D28D9B288") { throw "aria2.zip does not match its SHA-256" }
          Expand-Archive aria2.zip -DestinationPath aria2-tmp
          $a2 = Get-ChildItem aria2-tmp -Recurse -Filter aria2c.exe | Select-Object -First 1
          if ((Get-FileHash $a2.FullName -Algorithm SHA256).Hash -ne "BE2099C214F63A3CB4954B09A0BECD6E2E34660B886D4C898D260FEBFE9D70C2") { throw "aria2c.exe does not match its SHA-256" }
          Copy-Item $a2.FullName "$p/tools/"
          Copy-Item (Get-ChildItem aria2-tmp -Recurse -Filter COPYING | Select-Object -First 1).FullName "$p/tools/aria2-COPYING.txt"
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DMyAppVersion=$version" installer\ezoo.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          $hash = (Get-FileHash dist/EzooDownload-Setup.exe -Algorithm SHA256).Hash.ToLower()
          # the signature the program checks before it installs an update;
          # a release must never ship version.json with an empty sig
          # (docs/UPDATE-CHECKER.md §10): a missing key is a hard error
          # on releases, a warning only on non-release runs.
          $sig = ""
          if ($env:UPDATE_SIGNING_KEY) {
            $sig = (cargo run --quiet --release -p swiftget-engine --example sign_update -- $version $hash).Trim()
            if ($LASTEXITCODE -ne 0 -or $sig.Length -ne 128) { throw "could not sign the release" }
          } elseif ($env:IS_RELEASE -eq "true") {
            throw "UPDATE_SIGNING_KEY is not set: refusing to ship an unsigned version.json for a release"
          }
          $json = "{`n  ""version"": ""$version"",`n  ""url"": ""https://github.com/${{ github.repository }}/releases/download/v$version/EzooDownload-Setup.exe"",`n  ""sha256"": ""$hash"",`n  ""sig"": ""$sig""`n}`n"
          [IO.File]::WriteAllText("$PWD/dist/version.json", $json)
          Get-Content dist/version.json
          Compress-Archive -Path dist/EzooDownload-Setup.exe, dist/version.json -DestinationPath EzooDownload-windows.zip -Force
          # checksums for the release (sha256sum-style, like the Linux workflow).
          # version.json is NOT listed here: it is published later, only
          # after the extension is approved in both stores (see the
          # publish-updater-manifest job). The manifest is authenticated
          # by its own Ed25519 signature, never by this file, so the
          # sums file stays valid without it — and it must not be
          # re-uploaded later with --clobber to add the entry.
          $sums = @()
          foreach ($f in @("dist/EzooDownload-Setup.exe")) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            $sums += "$h  $(Split-Path $f -Leaf)"
          }
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS-windows.txt", ($sums -join "`n") + "`n")
          Get-Content dist/SHA256SUMS-windows.txt
          # sign the checksums file (Q12/Q33): the updater verifies
          # SHA256SUMS-windows.txt.sig when the release carries it
          # (selfupdate.rs: sums_signature_ok), so a tampered sums
          # file cannot bless a tampered artifact. Same key and
          # example as version.json; a missing key is a hard error
          # on releases, exactly like the version.json rule above.
          if ($env:IS_RELEASE -eq "true") {
            if (-not $env:UPDATE_SIGNING_KEY) { throw "UPDATE_SIGNING_KEY is not set: refusing to ship an unsigned SHA256SUMS-windows.txt for a release" }
            $sumsHash = (Get-FileHash dist/SHA256SUMS-windows.txt -Algorithm SHA256).Hash.ToLower()
            $sumsSig = (cargo run --quiet --release -p swiftget-engine --example sign_update -- $version $sumsHash).Trim()
            if ($LASTEXITCODE -ne 0 -or $sumsSig.Length -ne 128) { throw "could not sign SHA256SUMS-windows.txt" }
            [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS-windows.txt.sig", "$sumsSig`n")
            Get-Content dist/SHA256SUMS-windows.txt.sig
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: EzooDownload-windows-${{ env.VERSION }}
          path: |
            EzooDownload-windows.zip
            dist/*
          retention-days: 30
      # Upload the Windows setup to the release (created by the Linux
      # workflow on tags). Tag-only: a manual dispatch never publishes.
      # Waits for the release to appear, then uploads WITHOUT --clobber,
      # so a re-run fails loudly if the files already exist instead of
      # silently replacing a published release. Never deletes.
      - name: Publish Windows setup to the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $found = $false
          for ($i = 1; $i -le 20; $i++) {
            gh release view "v$env:VERSION" --repo "${{ github.repository }}" *> $null
            if ($LASTEXITCODE -eq 0) { $found = $true; break }
            Write-Host "Release v$env:VERSION not visible yet (attempt $i/20), waiting 30s..."
            Start-Sleep -Seconds 30
          }
          if (-not $found) {
            Write-Host "::warning::release v$env:VERSION was not created; the Windows setup stays in the run artifacts only"
            exit 0
          }
          # version.json is deliberately NOT uploaded here: the release
          # publishes its files first, and the updater manifest is
          # published later by the publish-updater-manifest dispatch,
          # only after the 1.1.2 extension is approved in both stores
          # (Chrome Web Store + AMO). Until then installed copies see
          # no update (the missing manifest is a silent fail).
          # The Firefox .xpi + firefox-updates.json are published by
          # the Linux workflow, not here (its `gh release create`
          # uploads all of dist/*); do not add them — a second upload
          # of the same asset name fails without --clobber.
          $files = @("dist/EzooDownload-Setup.exe", "dist/SHA256SUMS-windows.txt", "dist/ffmpeg.exe")
          if (Test-Path dist/SHA256SUMS-windows.txt.sig) { $files += "dist/SHA256SUMS-windows.txt.sig" }
          gh release upload "v$env:VERSION" @files --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { throw "could not upload the Windows setup to the release" }
          Write-Host "Windows setup published to v$env:VERSION"

  # Publish the updater manifest (version.json) to an existing release.
  # This is the SECOND half of a release, run by hand ONLY after the
  # 1.1.2 browser extension is approved in BOTH stores (Chrome Web
  # Store + AMO). The tag release publishes every file EXCEPT
  # version.json, so installed copies see no update until this job
  # runs: a release without the manifest asset is a silent fail in
  # the updater (selfupdate.rs), never an offer and never an error.
  # The manifest is derived from the PUBLISHED Setup.exe (downloaded
  # from the release and hashed here) — never from a rebuild — so the
  # sha256 in version.json always matches the file users download.
  # It never replaces anything: if version.json is already in the
  # release the job fails instead of overwriting it (no --clobber).
  # SECURITY (P8-sexies, 2026-11-08, the maintainer's decision):
  # this job runs under the `release-signing` environment with
  # required reviewers, so it cannot run at all — from main or from
  # any branch — until a reviewer approves it, and the production
  # signing key is handed to it only after that approval. The
  # `extension_approved_in_both_stores` checkbox is only a human
  # confirmation; it is NOT a guard. Before signing, the job verifies
  # the published Setup.exe against the release's own signed
  # checksums (SHA256SUMS-windows.txt + .sig) and refuses to sign
  # anything on any mismatch — see the verification step below.
  publish-updater-manifest:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # The signing key comes from the `release-signing` environment
    # (required reviewers). Until the environment is created and the
    # key moved into it, the repository secret of the same name is
    # used instead and the job runs ungated — the `environment:`
    # line alone protects nothing.
    environment: release-signing
    steps:
      - name: "Guard: main only, both stores must have approved the extension"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then echo "::error::this dispatch runs from main only (got '${{ github.ref_name }}')"; exit 1; fi
          if [ "${{ inputs.extension_approved_in_both_stores }}" != "true" ]; then
            echo "::error::refusing: the 1.1.2 extension must be approved in the Chrome Web Store AND AMO first — set extension_approved_in_both_stores=true only after both approvals"
            exit 1
          fi
          VERSION="${{ inputs.version }}"
          gh release view "v$VERSION" --repo "${{ github.repository }}" >/dev/null || { echo "::error::release v$VERSION does not exist"; exit 1; }
          if gh release view "v$VERSION" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -qx "version.json"; then
            echo "::error::version.json is already in release v$VERSION — refusing to replace it"
            exit 1
          fi
      # the signing tool comes from the release tree itself
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: v${{ inputs.version }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # FIX 2 (P8-sexies): verify WHAT is signed before signing it.
      # The release's own checksums (SHA256SUMS-windows.txt, signed
      # with the same key at tag time) are the trust anchor: if the
      # Setup.exe asset were replaced after publishing, its hash
      # would no longer match the signed sums, and this step fails
      # the job before anything is signed. It refuses on ANY of:
      # sums file missing, .sig missing, .sig invalid, hash
      # mismatch, or the Setup.exe entry missing from the sums
      # file. The .sig is verified with the program's own logic
      # (crates/engine/examples/verify_sums.rs, the same
      # selfupdate::sums_signature_ok the updater uses), so a
      # tampered sums file can never bless a tampered Setup.exe.
      # `gh release download` fails when a pattern matches no
      # asset, so a missing sums file or .sig fails this step too.
      - name: Verify the published Setup.exe against its signed checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ inputs.version }}"
          rm -f EzooDownload-Setup.exe SHA256SUMS-windows.txt SHA256SUMS-windows.txt.sig version.json
          gh release download "v$VERSION" --repo "${{ github.repository }}" -p "EzooDownload-Setup.exe" -p "SHA256SUMS-windows.txt" -p "SHA256SUMS-windows.txt.sig" -D .
          # (1) the sums file's Ed25519 signature must verify against
          # the public key built into the program (primary or
          # emergency key). This example is built from the checked-out
          # tag, so a tag predating P8-sexies fails closed here
          # instead of signing blind.
          cargo run --quiet --release -p swiftget-engine --example verify_sums -- "$VERSION" SHA256SUMS-windows.txt SHA256SUMS-windows.txt.sig \
            || { echo "::error::SHA256SUMS-windows.txt signature does not verify — refusing to sign anything"; exit 1; }
          # (2) the downloaded Setup.exe must match the entry the
          # signed sums file carries for it. The sums file covers
          # the Setup.exe only (P8-quinquies).
          HASH="$(sha256sum EzooDownload-Setup.exe | awk '{print $1}')"
          WANT="$(awk '$2 == "EzooDownload-Setup.exe" {print $1}' SHA256SUMS-windows.txt | head -1)"
          if [ -z "$WANT" ]; then echo "::error::SHA256SUMS-windows.txt has no entry for EzooDownload-Setup.exe — refusing to sign anything"; exit 1; fi
          if [ "$HASH" != "$WANT" ]; then echo "::error::EzooDownload-Setup.exe does not match its signed checksum ($HASH != $WANT) — the published asset may have been replaced; refusing to sign anything"; exit 1; fi
          echo "Setup.exe verified against its signed checksums (sha256 $HASH)"
          echo "VERIFIED_SHA256=$HASH" >> "$GITHUB_ENV"
      - name: Build and upload version.json to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$UPDATE_SIGNING_KEY" ]; then echo "::error::UPDATE_SIGNING_KEY is not set: refusing to ship an unsigned version.json"; exit 1; fi
          # EzooDownload-Setup.exe was downloaded and verified against
          # its signed checksums in the previous step; it is NOT
          # re-downloaded here, so the signed hash is the hash of the
          # verified file. Recompute it and check it against the
          # verified hash from the previous step.
          test -f EzooDownload-Setup.exe || { echo "::error::verified Setup.exe is missing"; exit 1; }
          HASH="$(sha256sum EzooDownload-Setup.exe | awk '{print $1}')"
          if [ "$HASH" != "$VERIFIED_SHA256" ]; then echo "::error::Setup.exe changed between verification and signing — refusing to sign"; exit 1; fi
          SIG="$(cargo run --quiet --release -p swiftget-engine --example sign_update -- "$VERSION" "$HASH")"
          if [ ${#SIG} -ne 128 ]; then echo "::error::could not sign the release"; exit 1; fi
          printf '{\n  "version": "%s",\n  "url": "https://github.com/%s/releases/download/v%s/EzooDownload-Setup.exe",\n  "sha256": "%s",\n  "sig": "%s"\n}\n' \
            "$VERSION" "${{ github.repository }}" "$VERSION" "$HASH" "$SIG" > version.json
          cat version.json
          gh release upload "v$VERSION" version.json --repo "${{ github.repository }}"
          echo "version.json published to v$VERSION — installed copies will be offered $VERSION on their next check"
          # the public download URL should resolve once GitHub's CDN
          # catches up; a delay here is a warning, not a failure —
          # the upload itself was already verified above
          for i in $(seq 1 10); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' -L "https://github.com/${{ github.repository }}/releases/latest/download/version.json")"
            if [ "$CODE" = "200" ]; then echo "releases/latest/download/version.json resolves (HTTP 200)"; exit 0; fi
            echo "version.json not resolving yet (HTTP $CODE, attempt $i/10), waiting 30s..."
            sleep 30
          done
          echo "::warning::version.json is in the release but releases/latest/download/version.json did not resolve within 5 minutes (CDN delay?) — check it by hand"
