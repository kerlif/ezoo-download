  <!-- tile: navy gradient, left #253149 -> right #1D283A -->
  <rect width="512" height="512" rx="82" fill="url(#edm-bg)"/>
  <rect width="512" height="512" rx="82" fill="url(#edm-sheen)"/>
  <!-- E #4687C7 -->
